{% extends "manage/base.html" %}

{% block manage_title %}Password{% endblock %}

{% block manage_content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title">Change your password</h4>
                <p class="text-muted">
                    This changes the password for <strong>{{ user.username | e }}</strong>.
                    Enter the current password. This session stays signed in.
                </p>
                <form method="post" action="/manage/password">
                    <div class="mb-3">
                        <label class="form-label" for="current-password">Current password</label>
                        <input type="password" name="current_password" id="current-password"
                               class="form-control" required autocomplete="current-password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="new-password">New password</label>
                        <input type="password" name="new_password" id="new-password"
                               class="form-control" required autocomplete="new-password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="confirm-password">Confirm new password</label>
                        <input type="password" name="confirm_password" id="confirm-password"
                               class="form-control" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary">Change password</button>
                    <p class="text-muted small mt-3 mb-0">Passwords are 8 to 200 characters.</p>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
