<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}INfoRM{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <style>
        .container-wide {
            width: 100%;
            max-width: 1800px;
            padding-right: 1rem;
            padding-left: 1rem;
            margin-right: auto;
            margin-left: auto;
        }
        @media (min-width: 1200px) {
            .container-wide {
                padding-right: 1.5rem;
                padding-left: 1.5rem;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-dark">

<!-- Consistent Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary mb-4">
    <div class="container">
        <!-- Logo + Brand -->
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="/static/logo.png" alt="INfoRM Logo" height="32" class="me-2">
	    <!-- <span class="fw-bold">INfoRM</span> -->
	    <span class="badge bg-secondary ms-2" style="font-size: 0.65rem;">v{{ app_version }}</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link {% if request.url.path == '/noc' %}active{% endif %}" href="/noc">NOC View</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.url.path == '/devices' %}active{% endif %}" href="/devices">Devices</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.url.path == '/history' %}active{% endif %}" href="/history">Alarm History</a>
                </li>
            </ul>

	    <ul class="navbar-nav">
    		<li class="nav-item">
        		<a class="nav-link {% if request.url.path == '/help' %}active{% endif %}" href="/help">Help</a>
    		</li>
    		<li class="nav-item">
        		<a class="nav-link {% if request.url.path == '/about' %}active{% endif %}" href="/about">About</a>
    		</li>
    		<li class="nav-item">
        		<a class="nav-link {% if request.url.path.startswith('/manage') %}active{% endif %}" href="/manage">Admin</a>
    		</li>

    		<!-- External Links Dropdown ADD/REMOVE Links here -->
    		<li class="nav-item dropdown">
        		<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
            			External Links
        		</a>
        		<ul class="dropdown-menu dropdown-menu-end">
				<li><a class="dropdown-item" href="https://github.com" target="_blank">GITHUB</a></li>
				<li><a class="dropdown-item" href="https://opensource.org/license/MIT" target="_blank">Open Source Initiative</a></li>
        		</ul>
    		</li>
	   </ul>
        </div>
    </div>
</nav>

<div class="{% block body_container %}container{% endblock %}">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
